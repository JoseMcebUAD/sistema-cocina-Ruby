name: Build Docker images

on:
  push:
    branches: ["main", "development"]

jobs:
  build-and-push-dockerfile-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set image tags
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAGS=joseceballosgant/api_sistema_cocina_rubi:production,joseceballosgant/api_sistema_cocina_rubi:latest" >> $GITHUB_OUTPUT
          else
            echo "TAGS=joseceballosgant/api_sistema_cocina_rubi:development" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.TAGS }}
          platforms: linux/amd64

      - name: Deploy to Dokploy (Production)
        if: github.ref_name == 'main'
        run: curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" --fail --silent

      - name: Deploy to Dokploy (Development)
        if: github.ref_name == 'development'
        run: curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL_DEV }}" --fail --silent