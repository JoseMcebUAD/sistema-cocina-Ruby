name: Run Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["development"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Maven 3.9+ lee MAVEN_ARGS y lo aplica a todos los comandos mvn
      MAVEN_ARGS: -B -ntp

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: sistema_cocina_ricky_test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Compilar
        run: |
          echo "::group::mvn test-compile"
          mvn test-compile
          echo "::endgroup::"

      - name: Ejecutar pruebas
        run: mvn verify --fail-at-end -Dspring.profiles.active=test -Dexcludes="**/archivomodulo/**"

      - name: Resumen de pruebas
        if: always()
        run: python3 .github/scripts/test_summary.py

      - name: Subir reportes y logs de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
