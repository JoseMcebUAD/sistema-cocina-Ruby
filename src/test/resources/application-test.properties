spring.datasource.url=jdbc:mysql://localhost:3306/cocina_rubi_test
spring.datasource.username=root
spring.datasource.password=

# ── Flyway: ejecuta migraciones completas en la DB de test ───────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disasbled=false
spring.flyway.repair-on-migrate=true

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── JWT (clave dummy para tests — NUNCA usar en producción) ──────────────────
# 32 bytes aleatorios base64 codificados; sin significado semántico
jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWZvci11bml0LXRlc3RzLW9ubHktMzItYnRz

# ── Cloudinary (valores dummy — tests no suben archivos) ─────────────────────
cloudinary.cloud-name=test-cloud
cloudinary.api-key=000000000000000
cloudinary.api-secret=test-secret

# ── Redis: apunta al Redis local de Docker ────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# ── Misc ─────────────────────────────────────────────────────────────────────
spring.main.banner-mode=off
spring.jpa.show-sql=false

# ── Logging silencioso (solo WARN en frameworks, INFO en código propio) ───────
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.cocinarubi=INFO

# Patrón corto para no ensuciar los archivos de salida de Surefire
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{25} - %msg%n
